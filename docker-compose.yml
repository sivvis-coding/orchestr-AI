services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestr-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - ./backend:/app # mount source for hot-reload
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: orchestr-ai-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
